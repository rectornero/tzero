# Static site: no build step, no functions. Articles load in the browser from Wix,
# so a deploy only happens when the design changes.
[build]
  publish = "."
  command = ""
  # Skip the deploy when a push only changes Markdown (README, CLAUDE.md): a production deploy costs 15 credits
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
