<!doctype html><html><head><meta charset="utf-8"><style>

<!-- timer: Valve's five-minute rule -->
<svg id="timer" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#13224b"/>
<g fill="#fff" opacity=".08"><rect x="80" y="90" width="300" height="180" rx="16"/><rect x="900" y="430" width="300" height="180" rx="16"/><rect x="100" y="470" width="240" height="140" rx="16"/></g>
<rect x="390" y="150" width="500" height="320" rx="24" fill="#1d2b5c" stroke="#3a4a85" stroke-width="4"/>
<rect x="420" y="180" width="440" height="200" rx="12" fill="#0b1430"/>
<path d="M600 230 L700 280 L600 330Z" fill="#d7182a"/>
<text x="640" y="430" text-anchor="middle" font-size="28" fill="#c8d0e6" font-weight="700">LAUNCH THE BUILD</text>
<circle cx="1000" cy="250" r="120" fill="#fff7e3" stroke="#d7182a" stroke-width="10"/>
<path d="M1000 250 L1000 160" stroke="#13224b" stroke-width="10" stroke-linecap="round"/><path d="M1000 250 L1060 280" stroke="#13224b" stroke-width="8" stroke-linecap="round"/>
<path d="M1000 130 A120 120 0 0 1 1104 190" stroke="#ffd34d" stroke-width="14" fill="none"/>
<text x="1000" y="420" text-anchor="middle" font-size="64" font-weight="800" fill="#fff">5:00</text>
<text x="640" y="580" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">Run it. Keep it running. Then submit.</text>
<text x="640" y="630" text-anchor="middle" font-size="24" fill="#9fb0d6">Valve's new release checklist item, drawn by TZERØ</text></svg>

<!-- hammock: lazy genius -->
<svg id="hammock" viewBox="0 0 1280 720"><defs><linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1430"/><stop offset="1" stop-color="#2a3b6e"/></linearGradient></defs>
<rect width="1280" height="720" fill="url(#hsky)"/>
<g fill="#fff"><circle cx="120" cy="90" r="2"/><circle cx="340" cy="160" r="2"/><circle cx="560" cy="70" r="3"/><circle cx="800" cy="130" r="2"/><circle cx="1020" cy="60" r="2"/><circle cx="1180" cy="170" r="3"/><circle cx="220" cy="260" r="1.5"/><circle cx="930" cy="250" r="1.5"/></g>
<path d="M1060 120 l10 26 28 2 -22 18 8 27 -24 -15 -24 15 8 -27 -22 -18 28 -2z" fill="#ffd34d"/>
<rect x="0" y="560" width="1280" height="160" fill="#1a2a4f"/>
<rect x="250" y="300" width="22" height="280" fill="#5a3822"/><rect x="1010" y="300" width="22" height="280" fill="#5a3822"/>
<path d="M272 340 Q640 560 1010 340" stroke="#c9a24a" stroke-width="6" fill="none"/>
<path d="M300 350 Q640 600 980 350 Q640 520 300 350Z" fill="#d7182a"/>
<g transform="translate(540 430)"><ellipse cx="80" cy="20" rx="140" ry="34" fill="#13224b"/><circle cx="-50" cy="-6" r="34" fill="#f0c49a"/><path d="M-84 -10 Q-70 -50 -30 -40 Q-10 -36 -18 -14Z" fill="#3a2a22"/>
<path d="M-62 -2 q8 6 16 0" stroke="#2a1d1a" stroke-width="3" fill="none"/><path d="M-40 -2 q8 6 16 0" stroke="#2a1d1a" stroke-width="3" fill="none"/></g>
<text x="760" y="380" font-size="40" font-weight="800" fill="#fff" opacity=".85">z</text><text x="800" y="340" font-size="54" font-weight="800" fill="#fff" opacity=".7">z</text><text x="850" y="290" font-size="70" font-weight="800" fill="#fff" opacity=".55">Z</text>
<g transform="translate(160 600)"><rect width="300" height="70" rx="10" fill="#fff7e3"/><text x="150" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#13224b">laziness: genius</text></g>
<g transform="translate(820 600)"><rect width="300" height="70" rx="10" fill="#fff7e3"/><text x="150" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#13224b">quality: obsessed</text></g></svg>

<!-- three tools, one hand -->
<svg id="toolset" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f6f1e6"/>
<g transform="translate(140 170)"><rect width="300" height="380" rx="10" fill="#fffdf6" stroke="#dfe6f3" stroke-width="4"/><g stroke="#dfe6f3" stroke-width="2"><line x1="20" y1="80" x2="280" y2="80"/><line x1="20" y1="120" x2="280" y2="120"/><line x1="20" y1="160" x2="280" y2="160"/><line x1="20" y1="200" x2="280" y2="200"/><line x1="20" y1="240" x2="280" y2="240"/></g>

<g transform="translate(490 170)"><rect width="300" height="380" rx="24" fill="#1d2433" stroke="#0f1420" stroke-width="12"/><path d="M150 110 l26 64 70 4 -54 44 18 68 -60 -38 -60 38 18 -68 -54 -44 70 -4z" fill="#ffd34d" stroke="#fff" stroke-width="4"/>
<text x="150" y="440" text-anchor="middle" font-size="34" font-weight="800" fill="#13224b">Tablet</text></g>
<g transform="translate(840 170)"><rect width="300" height="380" rx="24" fill="#13224b"/>
<g fill="none" stroke="#9fb0d6" stroke-width="2" opacity=".5"><circle cx="100" cy="120" r="34"/><circle cx="200" cy="130" r="28"/><circle cx="150" cy="200" r="40"/><circle cx="90" cy="260" r="26"/><circle cx="210" cy="260" r="30"/></g>
<circle cx="150" cy="200" r="40" fill="#d7182a" stroke="#fff" stroke-width="4"/>
<text x="150" y="440" text-anchor="middle" font-size="34" font-weight="800" fill="#13224b">AI</text></g>
<text x="640" y="90" text-anchor="middle" font-size="40" font-weight="800" fill="#d7182a">Three tools. One hand.</text></svg>

<!-- notepad with real notes -->
<svg id="notepad" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#2a3b6e"/>
<rect x="250" y="60" width="780" height="620" rx="8" fill="#fffdf6"/><rect x="250" y="60" width="780" height="56" rx="8" fill="#e8e1cf"/>
<text x="280" y="98" font-size="22" font-weight="700" fill="#6B7280">test-notes-0.9.0.txt  ·  Notepad</text>
<g font-family="Consolas,Menlo,monospace" font-size="26" fill="#13224b">
<text x="290" y="170">THE OPENING</text>
<text x="290" y="210">* The mission: love it. It fits the story.</text>
<text x="290" y="270">WEARY REACH</text>
<text x="290" y="310">* The feeling of collecting treasure is</text>
<text x="290" y="345">  important in a videogame.</text>
<text x="290" y="405">INSIDE THE MACHINE</text>
<text x="290" y="445">* Base music is too ambient: it should</text>
<text x="290" y="480">  sound like an arcade place, chiptune.</text>
<text x="290" y="540">FIGHT</text>
<text x="290" y="580">* Grid Break 2.5D: BEAUTIFUL.</text>
<text x="290" y="640" fill="#9aa3b5">... 66 more notes</text></g>
<rect x="830" y="560" width="3" height="30" fill="#13224b"/></svg>

<!-- token cost per step -->
<svg id="tokens" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f6f1e6"/>
<text x="640" y="80" text-anchor="middle" font-size="40" font-weight="800" fill="#13224b">Every step re-reads the whole thread</text>
<text x="640" y="125" text-anchor="middle" font-size="24" fill="#6B7280">rough cost of one step, same job</text>
<line x1="200" y1="600" x2="1100" y2="600" stroke="#13224b" stroke-width="4"/>
<rect x="300" y="450" width="220" height="150" fill="#9fb0d6"/><text x="410" y="430" text-anchor="middle" font-size="34" font-weight="800" fill="#13224b">1×</text>
<text x="410" y="645" text-anchor="middle" font-size="26" fill="#13224b">a fresh thread</text>
<rect x="760" y="170" width="220" height="430" fill="#d7182a"/><text x="870" y="155" text-anchor="middle" font-size="34" font-weight="800" fill="#d7182a">about 3×</text>
<text x="870" y="645" text-anchor="middle" font-size="26" fill="#13224b">350,000 tokens of history</text>
<text x="640" y="695" text-anchor="middle" font-size="20" fill="#6B7280">Figures from the studio's own token review, 10 Nov 2026. Drawing: TZERØ.</text></svg>

<!-- where the tokens go -->
<svg id="share" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#13224b"/>
<text x="640" y="110" text-anchor="middle" font-size="42" font-weight="800" fill="#fff">Where the tokens actually went</text>
<rect x="140" y="260" width="1000" height="140" rx="14" fill="#2a3b6e"/>
<rect x="140" y="260" width="875" height="140" rx="14" fill="#d7182a"/>
<text x="560" y="345" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">re-reading the conversation · 85–90%</text>
<text x="1078" y="345" text-anchor="middle" font-size="22" font-weight="800" fill="#c8d0e6">the</text>
<text x="1078" y="372" text-anchor="middle" font-size="22" font-weight="800" fill="#c8d0e6">work</text>
<text x="640" y="500" text-anchor="middle" font-size="30" fill="#c8d0e6">Writing code, prose and prompts was the cheap part.</text>
<text x="640" y="660" text-anchor="middle" font-size="20" fill="#9fb0d6">From the Starchasers studio's token review, 10 Nov 2026. Drawing: TZERØ.</text></svg>
