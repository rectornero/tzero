<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#13224b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;overflow:hidden}
#w{display:flex;flex-direction:column;height:100%;box-sizing:border-box;padding:14px}
#shelf{flex:1;position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;align-content:start;overflow:hidden;padding-top:6px}
.c{height:62px;border-radius:8px;background:#3a4566;color:#aab3cc;font-size:11px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;animation:in .35s ease;line-height:1.15}
@keyframes in{from{transform:scale(.6);opacity:0}}
#ours{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:200px;padding:14px 12px;border-radius:12px;background:#fff7e3;color:#13224b;text-align:center;
 box-shadow:0 0 0 3px #d7182a,0 0 30px 6px rgba(255,211,77,.45);transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .6s;z-index:2}
#ours b{display:block;font-size:17px}#ours span{font-size:12px;color:#6B7280}
#bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
button{font:700 14px system-ui,sans-serif;background:#d7182a;color:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 3px 0 #8c0f1b}
button.ghost{background:transparent;box-shadow:none;border:2px solid #6f7ba0;color:#c8d0e6}
#n{font-size:13px;color:#c8d0e6;min-width:120px;text-align:center}
#line{min-height:2.8em;text-align:center;font-style:italic;font-size:15px;line-height:1.4;margin:8px auto 0;max-width:560px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="w">
<div id="shelf"><div id="ours"><b>Our game</b><span>made with friends</span></div></div>
<div id="bar"><button id="add" type="button">A clone appears</button><span id="n">Clones on the shelf: 0</span><button id="reset" class="ghost" type="button">Start over</button></div>
<p id="line">A new game on the shelf. Watch what happens when copies show up.</p>
</div>
<script>
const NAMES=['Our Gaem','Our Game DX','0ur Game','Our Game: Remastered (not ours)','Game of Ours','Our Game 2 (fan)','Our Game but Faster','OUR GAME!!','Ourr Game','Our Game Idle','Our Game Clicker','Our Game Simulator','Our-Game','Ours Game','Our Game Plus Plus','Our Game Lite','Our Game Mobile','Our Game AI Edition','Our Game Tycoon','The Our Game','Our Game (Copy)','Our Game Final','Our Game Ultra','Our Game Again'];
const LINES={1:'One copy. People have been cloning games since forever.',5:'“There’s no way one copies the flame in people’s hearts.” (Nero)',10:'“And, if they really manage to, then it means we have more friends!” (Nero)',16:'“I trust quality naturally rises over background noise.” (Nero)',24:'Filed under: advertisement, unforeseen expenses.'};
const shelf=document.getElementById('shelf'),ours=document.getElementById('ours'),n=document.getElementById('n'),line=document.getElementById('line');let k=0;
function add(){if(k>=NAMES.length)return;const c=document.createElement('div');c.className='c';c.textContent=NAMES[k++];shelf.insertBefore(c,ours);
 n.textContent='Clones on the shelf: '+k;const s=1+Math.min(k,24)*.012;ours.style.transform=`translate(-50%,-50%) scale(${s})`;
 ours.style.boxShadow=`0 0 0 3px #d7182a,0 0 ${30+k*2}px ${6+k/2}px rgba(255,211,77,.5)`;
 for(const t of Object.keys(LINES).map(Number))if(k===t)line.textContent=LINES[t];
 if(k>=NAMES.length)document.getElementById('add').disabled=true}
document.getElementById('add').onclick=add;
document.getElementById('reset').onclick=()=>{for(const c of [...shelf.querySelectorAll('.c')])c.remove();k=0;n.textContent='Clones on the shelf: 0';ours.style.transform='';ours.style.boxShadow='';
 line.textContent='A new game on the shelf. Watch what happens when copies show up.';document.getElementById('add').disabled=false};
if(location.hash.includes('full')){for(let i=0;i<24;i++)add()}
if(location.hash.includes('clean')){document.getElementById('bar').style.display='none';line.style.display='none'}
</script></body></html>
